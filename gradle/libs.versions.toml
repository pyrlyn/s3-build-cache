[versions]
kotlin = "2.4.21"
awssdk = "2.57.8"
junit = "6.1.3"
mockk = "1.14.11"
testcontainers = "2.0.5"

[libraries]
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
awssdk-apache = { module = "software.amazon.awssdk:apache-client" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-minio = { module = "org.testcontainers:testcontainers-minio" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
